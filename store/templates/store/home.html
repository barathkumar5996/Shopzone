{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <!-- Welcome Banner -->

    <div class="p-5 mb-5 rounded shadow"
         style="background:linear-gradient(to right,#ff6b6b,#ff9f43); color:white;">

        <h1 class="fw-bold">
            Welcome to ShopZone 🛒
        </h1>

        <p>
            Find trending products with amazing offers 🔥
        </p>

    </div>


    <!-- Trending Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold">
            Trending Products 🔥
        </h2>

    </div>


    <!-- Product Grid -->

    <div class="row">

        {% for product in products %}

        <div class="col-md-2 mb-4">

            <div class="card shadow border-0 h-100">

                <!-- Product Image -->

                <a href="{% url 'product_detail' product.id %}">
                    <img src="{{ product.image.url }}"
                         class="card-img-top"
                         style="height:220px;object-fit:cover;">
                </a>

                <!-- Product Details -->

                <div class="card-body d-flex flex-column">

                    <h6 class="fw-bold"
                        style="
                        height:50px;
                        overflow:hidden;
                        display:-webkit-box;
                        -webkit-line-clamp:2;
                        -webkit-box-orient:vertical;">

                        {{ product.name }}

                    </h6>

                    <h5 class="text-success">

                        ₹{{ product.price }}

                    </h5>

                    <div class="d-flex gap-2 mt-auto">

                        <a href="{% url 'add_to_cart' product.id %}"
                           class="btn btn-warning w-50">

                            Cart

                        </a>

                        <a href="{% url 'product_detail' product.id %}"
                           class="btn btn-dark w-50">

                            Buy

                        </a>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
