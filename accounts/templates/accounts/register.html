{% extends 'base.html' %}

{% block content %}

<div class="container mt-5"
     style="max-width:500px;">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Create Account

        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-dark w-100">

                Register

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{% url 'login' %}">

                Already have account?

            </a>

        </div>

    </div>

</div>

{% endblock %}
