{% extends 'base.html' %}

{% block content %}

<div class="container mt-5"
     style="max-width:500px;">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            Login

        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-warning w-100">

                Login

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{% url 'register' %}">

                Create Account

            </a>

        </div>

    </div>

</div>

{% endblock %}
